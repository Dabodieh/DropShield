name: .NET

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DropShield.sln

      - name: Build (Release)
        run: dotnet build DropShield.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DropShield.sln --configuration Release --no-build
