name: .NET

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DropShield.sln

      - name: Build (Release)
        run: dotnet build DropShield.sln --configuration Release --no-restore

      - name: Test
        env:
          DROPSHIELD_REDIS_TEST_CONNECTION: 127.0.0.1:6379
        run: dotnet test DropShield.sln --configuration Release --no-build
